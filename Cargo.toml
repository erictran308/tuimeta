[package]
name = "tuimeta"
version = "0.1.0"
edition = "2024"
description = "Messenger and Instagram in your terminal: a vim-style client, with a separate helper for Meta's protocols"
license = "MIT"
repository = "https://github.com/erictran308/tuimeta"
readme = "README.md"
# Distributed on GitHub only, built from source; never published to crates.io.
publish = false
keywords = ["messenger", "instagram", "tui", "terminal", "vim"]
categories = ["command-line-utilities"]
# The helper is a separate program under the AGPL, built with Go; it's never
# part of this crate.
exclude = ["CLAUDE.md", ".env.example", ".github", "docs", "helper"]

[[bin]]
name = "tuimeta"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
arboard = "3.6.1"
base64 = "0.22"
chrono = "0.4.45"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
dotenvy = "0.15.7"
emojis = "0.9.0"
futures = "0.3.34"
image = "0.25"
open = { version = "5.4.4", features = ["shellexecute-on-windows"] }
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["image-defaults", "crossterm"] }
ratatui-textarea = "0.9.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
textwrap = "0.16.4"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
unicode-width = "0.2.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

